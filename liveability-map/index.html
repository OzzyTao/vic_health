<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bendigo Liveability Explorer — Scenario Comparison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <!-- Error banner -->
    <div id="error-banner" role="alert"></div>

    <!-- Loading indicator, shown while the scenario data fetches -->
    <div id="loading-indicator" class="loading-indicator" role="status" aria-live="polite">
      <div class="loading-indicator__mark">◈</div>
      <div class="loading-indicator__spinner"></div>
      <p class="loading-indicator__text">Loading liveability data…</p>
    </div>

    <!-- App header: brand + indicator/scenario toolbar -->
    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__mark">◈</span>
        <div class="app-header__title-group">
          <span class="app-header__title">Bendigo Liveability Explorer</span>
          <span class="app-header__subtitle">Scenario Comparison</span>
        </div>
      </div>
      <div id="toolbar" class="toolbar">
        <div id="indicator-selector" class="toolbar__group"></div>
        <div class="toolbar__divider"></div>
        <div id="left-scenario-selector" class="toolbar__group"></div>
        <div id="right-scenario-selector" class="toolbar__group"></div>
      </div>
    </header>

    <!-- Body: map panes + docked sidebar. The sidebar is laid out as a flex
         sibling (not an overlay), so it can never sit on top of the map and
         intercept clicks meant for a meshblock. -->
    <div class="app-body">
      <main class="map-comparison">
        <section class="map-pane">
          <div class="map-pane__label" id="label-left">Original</div>
          <div id="map-left" class="map-pane__map"></div>
        </section>
        <section class="map-pane">
          <div class="map-pane__label" id="label-right">Liveability</div>
          <div id="map-right" class="map-pane__map"></div>
        </section>
      </main>

      <!-- Docked sidebar: legend always shown, detail panel shown on selection -->
      <aside class="sidebar">
        <div id="legend" class="legend-container"></div>
        <div id="detail-panel" class="detail-panel" aria-live="polite" aria-label="Meshblock detail panel"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
